<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbeee0"/>
      <stop offset="100%" stop-color="#f6ddc4"/>
    </linearGradient>
    <radialGradient id="bowl" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7d9c8"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#e9c583"/>
      <stop offset="100%" stop-color="#c99a4e"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg2)"/>
  <ellipse cx="200" cy="330" rx="120" ry="18" fill="#c1440e" opacity="0.12"/>

  <path d="M90 220 Q90 300 200 305 Q310 300 310 220 Z" fill="url(#bowl)"/>
  <ellipse cx="200" cy="220" rx="110" ry="26" fill="#f3e5d5" stroke="#e7d9c8" stroke-width="3"/>

  <!-- round dough balls -->
  <g stroke="#a87a34" stroke-width="2">
    <circle cx="168" cy="212" r="24" fill="url(#ball)"/>
    <circle cx="210" cy="196" r="27" fill="url(#ball)"/>
    <circle cx="245" cy="216" r="22" fill="url(#ball)"/>
    <circle cx="192" cy="230" r="20" fill="url(#ball)"/>
  </g>

  <!-- sambal / seasoning fleck dots -->
  <g fill="#c1440e">
    <circle cx="162" cy="206" r="2"/>
    <circle cx="175" cy="216" r="1.6"/>
    <circle cx="205" cy="190" r="2"/>
    <circle cx="218" cy="200" r="1.6"/>
    <circle cx="240" cy="212" r="2"/>
    <circle cx="188" cy="226" r="1.6"/>
  </g>
</svg>
